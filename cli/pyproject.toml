[project]
name = "cli"
version = "0.1.0"
description = "CLI client per TheAdmin372 Daemon Engine"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "rich>=13.9.0",
]

[project.scripts]
theadmin372 = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"